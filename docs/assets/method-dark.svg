<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Generation-aware NanoKV compression</title>
<desc id="desc">A frozen video backbone supplies historical KV. NanoKV stores shared centers and INT4 residual coefficients. Keys and Values use different fitting objectives. The same stored representation supports full-dimensional attention or optional mixed-dimensional attention.</desc>
